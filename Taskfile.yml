version: '3'

silent: true

vars:
  AWS_REGION: eu-central-1
  CFN_DIR: cfn
  IAM_CFN_ROLES_STACK: iam-cfn-roles
  IAM_CFN_ROLES_TEMPLATE: "{{.CFN_DIR}}/iam-cfn-roles.yaml"

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  # Import needs a change set of type IMPORT, which cfn-deploy.sh does not create
  #
  # If import fails mid-way, delete the stuck stack and retry.
  # Example: aws cloudformation delete-stack --stack-name iam-cfn-roles --region eu-central-1
  iam-cfn-roles:import:
    desc: Import existing IAM roles into CloudFormation stack (one-time operation)
    cmds:
      - echo "Creating import changeset..."
      - aws cloudformation create-change-set
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --change-set-name import-existing-roles
          --change-set-type CREATE
          --template-body file://{{.IAM_CFN_ROLES_TEMPLATE}}
          --import-existing-resources
          --capabilities CAPABILITY_NAMED_IAM
          --region {{.AWS_REGION}}
          --no-cli-pager
      - echo "Waiting for changeset..."
      - aws cloudformation wait change-set-create-complete
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --change-set-name import-existing-roles
          --region {{.AWS_REGION}}
      - echo "Executing changeset..."
      - aws cloudformation execute-change-set
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --change-set-name import-existing-roles
          --region {{.AWS_REGION}}
          --no-cli-pager
      - echo "Waiting for stack creation..."
      - aws cloudformation wait stack-create-complete
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --region {{.AWS_REGION}}
      - echo "Import completed!"
      - aws cloudformation describe-stacks
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --query 'Stacks[0].[StackName,StackStatus]'
          --output table
          --region {{.AWS_REGION}}
          --no-cli-pager

  iam-cfn-roles:deploy:
    desc: Deploy the IAM CloudFormation roles stack, shows the changes and asks first
    # The script asks for confirmation on stdin
    interactive: true
    cmds:
      - ./scripts/cfn-deploy.sh deploy {{.IAM_CFN_ROLES_STACK}} {{.IAM_CFN_ROLES_TEMPLATE}} {{.AWS_REGION}}

  iam-cfn-roles:diff:
    desc: Show what a deploy of the local template would change, without applying it
    cmds:
      - ./scripts/cfn-deploy.sh preview {{.IAM_CFN_ROLES_STACK}} {{.IAM_CFN_ROLES_TEMPLATE}} {{.AWS_REGION}}

  iam-cfn-roles:logs:
    desc: Show the latest events of the IAM CloudFormation roles stack
    cmds:
      - aws cloudformation describe-stack-events
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --max-items 25
          --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]'
          --output table
          --region {{.AWS_REGION}}
          --no-cli-pager

  iam-cfn-roles:rm:
    desc: Delete the IAM CloudFormation roles stack, the roles stay
    prompt: Delete the stack {{.IAM_CFN_ROLES_STACK}}? The IAM roles stay because of DeletionPolicy Retain.
    cmds:
      - aws cloudformation delete-stack
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --region {{.AWS_REGION}}
          --no-cli-pager
      - aws cloudformation wait stack-delete-complete
          --stack-name {{.IAM_CFN_ROLES_STACK}}
          --region {{.AWS_REGION}}
