AWSTemplateFormatVersion: '2010-09-09'
Description: "Resource Control Policies for AWS Organizations - encryption, secure transport, org-only access, OIDC restrictions"

Parameters:
  OrganizationId:
    Type: String
    Description: "AWS Organizations ID (e.g., o-xxxxxxxxxx)"
  OrganizationRootId:
    Type: String
    Description: "AWS Organizations root ID (e.g., r-xxxx)"
  GitHubRepo:
    Type: String
    Description: "GitHub repository allowed for OIDC (format: org/repo or org/* for all repos)"
  GitHubRepoImmutable:
    Type: String
    Description: "GitHub repository allowed for OIDC, immutable ID format (format: org@org_id/repo@repo_id or org@org_id/* for all repos)"

Resources:
  # RCP for security and compliance
  # Why: Enforces encryption, secure transport, and organization-only access
  ResourceControlPolicies:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Organizations::Policy
    Properties:
      Type: RESOURCE_CONTROL_POLICY
      Name: ResourceControlPolicies
      Description: |
        RCP for security and compliance (encryption, secure transport, org-only access, OIDC restrictions).
        See: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
      Content:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceSecureTransport
            Effect: Deny
            Principal: '*'
            Action:
              - 'sts:*'
              - 's3:*'
              - 'sqs:*'
              - 'secretsmanager:*'
              - 'kms:*'
            Resource: '*'
            Condition:
              BoolIfExists:
                'aws:SecureTransport': 'false'
          - Sid: EnforceS3TlsVersion
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:*'
            Resource: '*'
            Condition:
              NumericLessThan:
                's3:TlsVersion':
                  - '1.2'
          # Exclude CloudFormation template buckets (cf-templates-*) - AWS doesn't enforce
          # encryption headers when uploading templates via the CloudFormation console/API
          - Sid: EnforceEncryption
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:PutObject'
            NotResource:
              - 'arn:aws:s3:::cf-templates-*/*'
            Condition:
              'Null':
                's3:x-amz-server-side-encryption': 'true'
          - Sid: DenyS3PublicAccess
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:PutBucketAcl'
              - 's3:PutBucketPolicy'
              - 's3:PutObjectAcl'
            Resource: '*'
            Condition:
              StringEquals:
                's3:x-amz-acl':
                  - 'public-read'
                  - 'public-read-write'
                  - 'authenticated-read'
          # Based on the AWS sample identity_perimeter_rcp.json, without exceptions
          # https://github.com/aws-samples/data-perimeter-policy-examples/tree/main/resource_control_policies
          # sts:GetCallerIdentity needs no permissions, SAML/OIDC federation is controlled elsewhere
          - Sid: EnforceOrgIdentities
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:*'
              - 'sts:AssumeRole'
              - 'sts:DecodeAuthorizationMessage'
              - 'sts:GetAccessKeyInfo'
              - 'sts:GetFederationToken'
              - 'sts:GetServiceBearerToken'
              - 'sts:GetSessionToken'
              - 'sts:SetContext'
              - 'kms:*'
              - 'sqs:*'
              - 'secretsmanager:*'
              - 'cognito-idp:*'
              - 'logs:*'
              - 'dynamodb:*'
              - 'ecr:*'
              - 'aoss:*'
              - 'codeartifact:*'
              - 'dsql:*'
              - 'events:*'
              - 'elasticfilesystem:*'
              - 'schemas:*'
              - 'signer:*'
              - 'sns:*'
              - 'ssm-incidents:*'
              - 'cloudtrail-data:*'
            Resource: '*'
            Condition:
              StringNotEqualsIfExists:
                'aws:PrincipalOrgID': !Ref OrganizationId
              BoolIfExists:
                'aws:PrincipalIsAWSService': 'false'
          # AWS services may act on our resources only on behalf of resources in our organization
          # Applies only to requests with aws:SourceAccount, other service integrations are not affected
          - Sid: EnforceConfusedDeputyProtection
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:*'
              - 'sts:*'
              - 'kms:*'
              - 'sqs:*'
              - 'secretsmanager:*'
              - 'cognito-identity:*'
              - 'cognito-idp:*'
              - 'logs:*'
              - 'dynamodb:*'
              - 'ecr:*'
              - 'aoss:*'
              - 'codeartifact:*'
              - 'dsql:*'
              - 'events:*'
              - 'elasticfilesystem:*'
              - 'schemas:*'
              - 'signer:*'
              - 'sns:*'
              - 'ssm-incidents:*'
              - 'cloudtrail-data:*'
            Resource: '*'
            Condition:
              StringNotEqualsIfExists:
                'aws:SourceOrgID': !Ref OrganizationId
              'Null':
                'aws:SourceAccount': 'false'
              Bool:
                'aws:PrincipalIsAWSService': 'true'
      TargetIds:
        - !Ref OrganizationRootId

  RCPRestrictOIDCToApprovedProviders:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Organizations::Policy
    Properties:
      Type: RESOURCE_CONTROL_POLICY
      Name: RCPRestrictOIDCToApprovedProviders
      Description: Deny non approved OIDC providers Org wide
      Content:
        Version: 2012-10-17
        Statement:
          # Only GitHub and our own issuers on oidc.wombacher.dev, one path per issuer
          - Sid: ApprovedProviders
            Effect: Deny
            Principal: '*'
            Action:
              - 'sts:AssumeRoleWithWebIdentity'
            Resource: '*'
            Condition:
             StringNotLike:
               'aws:FederatedProvider':
                 - 'arn:aws:iam::*:oidc-provider/token.actions.githubusercontent.com'
                 - 'arn:aws:iam::*:oidc-provider/oidc.wombacher.dev/*'
          - Sid: GitHubRepo
            Effect: Deny
            Principal: '*'
            Action:
              - 'sts:AssumeRoleWithWebIdentity'
            Resource: '*'
            Condition:
             StringLike:
               'aws:FederatedProvider': 'arn:aws:iam::*:oidc-provider/token.actions.githubusercontent.com'
             StringNotLike:
               'token.actions.githubusercontent.com:sub':
                 - !Sub 'repo:${GitHubRepo}:*'
                 - !Sub 'repo:${GitHubRepoImmutable}:*'
      TargetIds:
        - !Ref OrganizationRootId

Outputs:
  ResourceControlPoliciesId:
    Description: Resource Control Policies ID
    Value: !Ref ResourceControlPolicies
    Export:
      Name: !Sub "${AWS::StackName}-ResourceControlPolicies-PolicyId"

  RCPRestrictOIDCToApprovedProvidersId:
    Description: RCP Restrict OIDC to Approved Providers ID
    Value: !Ref RCPRestrictOIDCToApprovedProviders
    Export:
      Name: !Sub "${AWS::StackName}-RCPRestrictOIDCToApprovedProviders-PolicyId"
