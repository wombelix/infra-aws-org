AWSTemplateFormatVersion: '2010-09-09'
Description: "Service Control Policies - Cost optimization"

Parameters:
  OrganizationRootId:
    Type: String
    Description: "AWS Organizations root ID (e.g., r-xxxx)"

Resources:
  DenyExpensiveServices:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: DenyExpensiveServices
      Description: "Allow list of services. Deny all other services and single actions with costs beyond pay per use in allowed services."
      Content:
        Version: 2012-10-17
        Statement:
          # Allow list: every service not listed here is denied
          # Review the actions of a service before adding it, deny the ones with potentially unwanted costs
          - Sid: DenyServicesNotAllowed
            Effect: Deny
            NotAction:
              - 'cloudformation:*'
              - 'codeconnections:*'
              - 'dynamodb:*'
              - 'events:*'
              - 'health:*'
              - 'iam:*'
              - 'kms:*'
              - 'organizations:*'
              - 's3:*'
              - 'signin:*'
              # Parameter Store only, no other Systems Manager features
              - 'ssm:*Parameter*'
              - 'ssm:AddTagsToResource'
              - 'ssm:ListTagsForResource'
              - 'ssm:RemoveTagsFromResource'
              - 'ssm:GetServiceSetting'
              - 'sso:*'
              - 'sts:*'
              - 'support:*'
              - 'tag:*'
            Resource: '*'

          # Block DynamoDB reserved capacity - upfront commitment
          - Sid: DenyDynamoDBReservedCapacity
            Effect: Deny
            Action:
              - 'dynamodb:PurchaseReservedCapacityOfferings'
            Resource: '*'

          # Block DynamoDB global tables - multiplies costs per region
          - Sid: DenyDynamoDBGlobalTables
            Effect: Deny
            Action:
              - 'dynamodb:CreateGlobalTable'
              - 'dynamodb:UpdateGlobalTable'
              - 'dynamodb:CreateTableReplica'
            Resource: '*'

          # Block EventBridge archives - storage costs accumulate if forgotten
          - Sid: DenyEventBridgeArchive
            Effect: Deny
            Action:
              - 'events:CreateArchive'
              - 'events:UpdateArchive'
            Resource: '*'

          # Block EventBridge replay - requires archive which has storage costs
          - Sid: DenyEventBridgeReplay
            Effect: Deny
            Action:
              - 'events:StartReplay'
            Resource: '*'

          # Block SSM parameter policies - they require the paid advanced tier
          # No condition key exists for the tier itself, an explicit --tier Advanced stays possible
          - Sid: DenySSMParameterPolicies
            Effect: Deny
            Action:
              - 'ssm:PutParameter'
            Resource: '*'
            Condition:
              StringEquals:
                'ssm:Policies': 'true'

          # Known actions with constant costs, deny them when their service is added:
          # ec2: RunInstances, CreateNatGateway, MonitorInstances, reserved instance purchases,
          #   volumes other than gp3, CreateVpcEndpoint except S3/DynamoDB gateways (use StringNotLike)
          # lambda: provisioned concurrency, provisioned event source mappings, needs logs too
          # bedrock: provisioned throughput, model customization and import, marketplace endpoints
          # elasticfilesystem: provisioned throughput mode
          # schemas: discoverers
          # Commitments: savingsplans, aws-marketplace, route53domains, shield, acm-pca, outposts, snowball
          # Monthly base costs, keep off the list: rds, elasticache, redshift*, es, opensearch, memorydb,
          #   docdb, neptune*, dax, kinesis*, kafka*, mq, eks, emr*, fsx, securityhub, elasticloadbalancing

      TargetIds:
        - !Ref OrganizationRootId

Outputs:
  DenyExpensiveServicesPolicyId:
    Description: Consolidated Cost Optimization SCP Policy ID
    Value: !Ref DenyExpensiveServices
    Export:
      Name: !Sub "${AWS::StackName}-DenyExpensiveServices-PolicyId"
