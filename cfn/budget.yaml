AWSTemplateFormatVersion: '2010-09-09'
Description: "Budget and Cost Anomaly Detection for AWS Organizations"

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives budget and cost anomaly alerts

Resources:
  # Topic for budget and cost anomaly alerts, created in the console and imported
  AlertSnsTopic:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SNS::Topic
    Properties:
      TopicName: Notifications

  AlertSnsTopicPolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SNS::TopicInlinePolicy
    Properties:
      TopicArn: !Ref AlertSnsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-sns-policy.html
          - Sid: AWSBudgetsSNSPublishingPermissions
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: SNS:Publish
            Resource: !Ref AlertSnsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:budgets::${AWS::AccountId}:*"
          # https://docs.aws.amazon.com/cost-management/latest/userguide/ad-SNS.html
          - Sid: AWSAnomalyDetectionSNSPublishingPermissions
            Effect: Allow
            Principal:
              Service: costalerts.amazonaws.com
            Action: SNS:Publish
            Resource: !Ref AlertSnsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertEmailSubscription:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertSnsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Monthly cost budget with alerts at 75% and 100% thresholds
  # Why: Proactive cost monitoring to prevent billing surprises
  MonthlyCostBudget:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: Default Cost Budget
        BudgetLimit:
          Amount: 10
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 75
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertSnsTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 75
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertSnsTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertSnsTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertSnsTopic

  # Cost anomaly detection for all AWS services
  # Why: Free ML-powered anomaly detection to catch unexpected cost spikes
  CostAnomalyDefaultServicesMonitor:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: Default-Services-Monitor
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE

  # Cost anomaly subscription for sns topic
  # Why: Get notified of cost anomalies above $5 threshold
  CostAnomalyDefaultServicesSubscription:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: Default-Services-Subscription
      Frequency: IMMEDIATE
      MonitorArnList:
        - !Ref CostAnomalyDefaultServicesMonitor
      Subscribers:
        - Type: SNS
          Address: !Ref AlertSnsTopic
      ThresholdExpression: |
        {
          "Dimensions": {
            "Key": "ANOMALY_TOTAL_IMPACT_PERCENTAGE",
            "MatchOptions": [ "GREATER_THAN_OR_EQUAL" ],
            "Values": [ "10" ]
          }
        }

Outputs:
  MonthlyCostBudgetId:
    Description: Monthly Cost Budget ID
    Value: !Ref MonthlyCostBudget
    Export:
      Name: !Sub "${AWS::StackName}-MonthlyCostBudget-Id"

  CostAnomalyDefaultServicesMonitorId:
    Description: Serverless Cost Anomaly Monitor ID
    Value: !Ref CostAnomalyDefaultServicesMonitor
    Export:
      Name: !Sub "${AWS::StackName}-CostAnomalyDefaultServicesMonitor-Id"

  CostAnomalyDefaultServicesSubscriptionId:
    Description: Cost Anomaly Subscription ID
    Value: !Ref CostAnomalyDefaultServicesSubscription
    Export:
      Name: !Sub "${AWS::StackName}-CostAnomalyDefaultServicesSubscription-Id"
