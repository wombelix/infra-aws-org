AWSTemplateFormatVersion: '2010-09-09'
Description: "Service Control Policies for AWS Organizations - Global governance controls"

Parameters:
  OrganizationRootId:
    Type: String
    Description: "AWS Organizations root ID (e.g., r-xxxx)"
  AwsOrgOUIdProjects:
    Type: String
    Description: "Organizational Unit ID for project accounts (e.g., ou-xxxx-xxxxxxxx)"
  AwsOrgOUIdSuspended:
    Type: String
    Description: "Organizational Unit ID for suspended accounts (e.g., ou-xxxx-xxxxxxxx)"

Resources:
  ServiceControlPolicies:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: ServiceControlPolicies
      Description: |
        Global Service Control Policy combining all governance and security controls.
        This policy merges the foundational and security SCPs into a single policy.
      Content:
        Version: 2012-10-17
        Statement:
          - Sid: DenyAllOutsideEU
            Effect: Deny
            NotAction:
              - 'a4b:*'
              - 'aws-marketplace-management:*'
              - 'aws-marketplace:*'
              - 'aws-portal:*'
              - 'budgets:*'
              - 'ce:*'
              - 'chime:*'
              - 'cloudfront:*'
              - 'config:*'
              - 'cur:*'
              - 'directconnect:*'
              - 'ec2:DescribeRegions'
              - 'ec2:DescribeTransitGateways'
              - 'ec2:DescribeVpnGateways'
              - 'fms:*'
              - 'globalaccelerator:*'
              - 'health:*'
              - 'iam:*'
              - 'importexport:*'
              - 'mobileanalytics:*'
              - 'networkmanager:*'
              - 'organizations:*'
              - 'pricing:*'
              - 'route53:*'
              - 'route53domains:*'
              - 'route53-recovery-cluster:*'
              - 'route53-recovery-control-config:*'
              - 'route53-recovery-readiness:*'
              - 's3:GetAccountPublic*'
              - 's3:ListAllMyBuckets'
              - 's3:ListMultiRegionAccessPoints'
              - 's3:PutAccountPublic*'
              - 'shield:*'
              - 'support:*'
              - 'trustedadvisor:*'
              - 'waf-regional:*'
              - 'waf:*'
              - 'wafv2:*'
              - 'wellarchitected:*'
            Resource: '*'
            Condition:
              StringNotEquals:
                'aws:RequestedRegion':
                  - eu-central-1
                  - eu-west-1

          - Sid: DenyDeleteDefaultCloudWatchLogGroups
            Effect: Deny
            Action:
              - logs:DeleteLogGroup
            Resource:
              - arn:aws:logs:*:*:log-group:/aws/*

          - Sid: RootUserDenyAllExceptActionsThatRequireRootAccess
            Effect: Deny
            NotAction:
              - 'iam:GetAccountSummary'
              - 'iam:DeleteAccessKey'
              - 'iam:DeleteSigningCertificate'
              - 'iam:DeleteLoginProfile'
              - 'iam:DeactivateMFADevice'
              - 'iam:ListAccessKeys'
              - 'iam:ListSigningCertificates'
              - 'iam:GetLoginProfile'
              - 'iam:ListMFADevices'
              - 'iam:GetUser'
              - 'iam:GetAccessKeyLastUsed'
              - 'iam:CreateLoginProfile'
              - 's3:DeleteBucketPolicy'
              - 's3:PutBucketPolicy'
              - 's3:GetBucketPolicy'
              - 's3:ListAllMyBuckets'
              - 'sqs:SetQueueAttributes'
              - 'sqs:GetQueueAttributes'
              - 'sqs:ListQueues'
              - 'sqs:GetQueueUrl'
            Resource: '*'
            Condition:
              StringLike:
                'aws:PrincipalArn': 'arn:aws:iam::*:root'

          - Sid: DenyOrganizationLevelActions
            Effect: Deny
            Action:
              - 'organizations:LeaveOrganization'
              - 'sso:CreateInstance'
              - 'cloudtrail:DeleteTrail'
              - 'cloudtrail:StopLogging'
              - 'cloudtrail:UpdateTrail'
              - 'aws-portal:*'
              - 'budgets:*'
              - 'ce:*'
              - 'cur:*'
              - 'iam:CreateUser'
              - 'iam:CreateAccessKey'
              - 'iam:UpdateAccessKey'
            Resource: '*'

          - Sid: DenyS3PutAccountPublicAccessBlockIfNotStrict
            Effect: Deny
            Action: "s3:PutAccountPublicAccessBlock"
            Resource: "*"
            Condition:
              StringNotEquals:
                "s3:BlockPublicAcls": "true"
                "s3:BlockPublicPolicy": "true"
                "s3:IgnorePublicAcls": "true"
                "s3:RestrictPublicBuckets": "true"

          - Sid: DenySensitiveActionsWithoutMFA
            Effect: Deny
            Action:
              - "aws-portal:ModifyBilling"
              - "aws-portal:ModifyPaymentMethods"
              - "iam:DeleteUser"
              - "iam:UpdateAccountPasswordPolicy"
              - "organizations:LeaveOrganization"
            Resource: "*"
            Condition:
              BoolIfExists:
                "aws:MultiFactorAuthPresent": "false"
              ArnNotLike:
                "aws:PrincipalARN":
                  - "arn:aws:iam::*:role/AWSCloudFormationStackSetExecutionRole"
                  - "arn:aws:iam::*:role/CloudFormationExecutionRole"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_AdministratorAccess_*"

          # Prevent irreversible data lock-in actions
          # These can lock data making it impossible to delete or modify
          # See: https://github.com/iann0036/iam-actions-cost
          - Sid: DenyDataLockIn
            Effect: Deny
            Action:
              - 's3:PutObjectRetention'
              - 's3:PutObjectLegalHold'
              - 's3:BypassGovernanceRetention'
              - 's3:PutBucketObjectLockConfiguration'
              - 's3-object-lambda:PutObjectLegalHold'
              - 's3-object-lambda:PutObjectRetention'
              - 'glacier:InitiateVaultLock'
              - 'glacier:CompleteVaultLock'
              - 'backup:PutBackupVaultLockConfiguration'
            Resource: '*'

      TargetIds:
        - !Ref OrganizationRootId

  # Protect the vended baseline in project accounts against changes by the project itself
  # StackSets manages these roles through stacksets-exec-* roles, created by a service-linked role that SCPs don't affect
  ProjectsServiceControlPolicies:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: ProjectsServiceControlPolicies
      Description: Protect vended baseline roles and the GitHub OIDC provider in project accounts
      Content:
        Version: 2012-10-17
        Statement:
          - Sid: ProtectVendedBaseline
            Effect: Deny
            Action:
              - 'iam:CreateRole'
              - 'iam:UpdateAssumeRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:DeleteRolePolicy'
              - 'iam:AttachRolePolicy'
              - 'iam:DetachRolePolicy'
              - 'iam:PutRolePermissionsBoundary'
              - 'iam:DeleteRolePermissionsBoundary'
              - 'iam:UpdateRole'
              - 'iam:DeleteRole'
              - 'iam:TagRole'
              - 'iam:UntagRole'
              - 'iam:CreateOpenIDConnectProvider'
              - 'iam:DeleteOpenIDConnectProvider'
              - 'iam:UpdateOpenIDConnectProviderThumbprint'
              - 'iam:AddClientIDToOpenIDConnectProvider'
              - 'iam:RemoveClientIDFromOpenIDConnectProvider'
            Resource:
              - 'arn:aws:iam::*:role/*-ProjectRole'
              - 'arn:aws:iam::*:role/stacksets-exec-*'
              - 'arn:aws:iam::*:role/OrganizationAccountAccessRole'
              - 'arn:aws:iam::*:oidc-provider/token.actions.githubusercontent.com'
            Condition:
              ArnNotLike:
                'aws:PrincipalArn': 'arn:aws:iam::*:role/stacksets-exec-*'
      TargetIds:
        - !Ref AwsOrgOUIdProjects

  # Freeze parked accounts, only StackSets can still remove its stack instances
  SuspendedServiceControlPolicies:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: SuspendedServiceControlPolicies
      Description: Deny all actions in suspended accounts
      Content:
        Version: 2012-10-17
        Statement:
          - Sid: DenyAll
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition:
              ArnNotLike:
                'aws:PrincipalArn': 'arn:aws:iam::*:role/stacksets-exec-*'
      TargetIds:
        - !Ref AwsOrgOUIdSuspended

Outputs:
  ServiceControlPoliciesPolicyId:
    Description: Global SCP Policy ID
    Value: !Ref ServiceControlPolicies
    Export:
      Name: !Sub "${AWS::StackName}-ServiceControlPolicies-PolicyId"

  ProjectsServiceControlPoliciesPolicyId:
    Description: Projects OU SCP Policy ID
    Value: !Ref ProjectsServiceControlPolicies
    Export:
      Name: !Sub "${AWS::StackName}-ProjectsServiceControlPolicies-PolicyId"

  SuspendedServiceControlPoliciesPolicyId:
    Description: Suspended OU SCP Policy ID
    Value: !Ref SuspendedServiceControlPolicies
    Export:
      Name: !Sub "${AWS::StackName}-SuspendedServiceControlPolicies-PolicyId"
